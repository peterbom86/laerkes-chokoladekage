<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lærkes chokoladekage</title><style>body{font:18px system-ui;background:#fff5ed;color:#572b44;margin:0}header{background:#6e3455;color:white;padding:28px;text-align:center}main{max-width:800px;margin:24px auto;padding:24px;background:white;border-radius:24px}button{padding:12px 18px;border:0;border-radius:12px;background:#cf4389;color:white;font-weight:bold;cursor:pointer}.art{text-align:center;font-size:90px;background:#fff0dd;border-radius:20px;padding:12px}.tip{padding:14px;background:#e5f3e6;border-radius:12px}label{display:block;padding:7px}input{width:20px;height:20px}#finish{display:none;text-align:center}.medal{font-size:100px}</style></head><body><header><h1>🍫 Lærkes chokoladekage 🎂</h1><p>Dit eget lille bage-eventyr!</p></header><main><p id="count"></p><h2 id="title"></h2><div class="art" id="art"></div><div id="body"></div><p class="tip" id="tip"></p><button id="back">← Tilbage</button> <button id="next">Næste trin →</button><section id="finish"><div class="medal">🏅</div><h2>LÆRKES KAGE-MESTER-MEDALJE!</h2><p>Du gjorde det! Du har bagt din egen chokoladekage! 🎉</p><button onclick="i=0;render()">Bag igen ↻</button></section></main><script>const s=[['Find ingredienserne','🧺🥚🥛','<h3>Kakaoblanding</h3>'+['4 spsk kakao','1 dl sukker','2 dl mælk'].map(x=>'<label><input type=checkbox> '+x+'</label>').join('')+'<h3>Kagedej</h3>'+['1½ dl sukker','125 g blødt smør','2 æg','200 g hvedemel','1½ tsk bagepulver','1 spsk vaniljesukker'].map(x=>'<label><input type=checkbox> '+x+'</label>').join(''),'Kryds af, når du har fundet tingene.'],['Lav kakaoblandingen','🍫🥛','Kom kakao, 1 dl sukker og mælk i en gryde. Rør rundt, mens en voksen giver det et kort opkog.','🔥 Voksen-hjælp med komfuret!'],['Lad den køle af','❄️🥣','Stil kakaoblandingen til side, til den er kølig eller højst lun.','Tålmodighed er en bage-superkraft!'],['Pisk smør og sukker','🧈🌀','Pisk 125 g blødt smør og 1½ dl sukker, til det bliver lyst og cremet.','Spørg en voksen om hjælp med håndmixeren.'],['Tilsæt æggene','🥚🥚','Pisk ét æg i ad gangen.','Slå gerne æggene ud i en kop først.'],['Bland det tørre','🌾🥣','Bland 200 g hvedemel, 1½ tsk bagepulver og 1 spsk vaniljesukker i en anden skål.','Rør godt rundt.'],['Bland dejen','🥄🍫','Rør melblandingen og den afkølede kakaoblanding i skiftevis, lidt ad gangen.','Rør, til dejen er ensartet.'],['Bag kagen','🔥🎂','Hæld dejen i en smurt, flad form. Bag ved 150 °C i cirka 1 time.','Voksen skal håndtere ovnen og tjekke, om kagen er færdig.'],['Du er kage-mester!','🏅🎉','Du bagte din egen chokoladekage! Lad den køle af, før I skærer den ud.','Medalje for mod, tålmodighed og lækker kage!']];let i=0;function render(){document.getElementById('finish').style.display=i===s.length-1?'block':'none';document.getElementById('count').textContent='Trin '+(i+1)+' af '+s.length;document.getElementById('title').textContent=s[i][0];document.getElementById('art').textContent=s[i][1];document.getElementById('body').innerHTML=s[i][2];document.getElementById('tip').textContent=s[i][3];document.getElementById('next').textContent=i===s.length-1?'Start forfra ↻':'Næste trin →';document.getElementById('back').disabled=i===0;document.getElementById('next').onclick=()=>{i=i===s.length-1?0:i+1;render()}}document.getElementById('back').onclick=()=>{if(i>0)i--;render()};render();</script></main></body></html>
